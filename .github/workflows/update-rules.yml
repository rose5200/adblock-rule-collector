name: 每日更新规则

on:
  schedule:
    # 每天北京时间早上 8:00 触发（UTC 0:00）
    - cron: '0 0 * * *'
  # 也可以手动触发，方便测试
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 执行合并去重脚本
        run: python merge_rules.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add final-adblock-rules.txt
          git diff --staged --quiet || git commit -m "自动更新规则 $(date +'%Y-%m-%d')"
          git push
